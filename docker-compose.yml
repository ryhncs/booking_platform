x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true"
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  env_file: ./backend/.env.example
  environment:
    DATABASE_URL: postgres://booking:booking@db:5432/booking
    REDIS_URL: redis://redis:6379
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  web:
    <<: *backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # Executes tasks (emails, reminders). Dev emails use the console backend, so
  # they appear in this container's log: `docker compose logs -f worker`.
  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  # Fires the periodic tasks in CELERY_BEAT_SCHEDULE (reminders, expiring holds).
  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  # Vite dev server for the React app: http://localhost:5173
  frontend:
    image: node:24-alpine
    working_dir: /app
    # Install exactly what package-lock.json says, but only when it changed
    # since the last install (npm stamps node_modules/.package-lock.json).
    command: >
      sh -c "{ [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund; } &&
             npm run dev -- --host 0.0.0.0"
    environment:
      # Vite proxies /api to Django, so the browser only ever talks to :5173
      # and Django needs no CORS settings.
      VITE_API_PROXY_TARGET: http://web:8000
      # File-change events don't cross a Windows bind mount; poll instead.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep node_modules inside Docker: Linux-native binaries, and much faster
      # than a Windows bind mount.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
